<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · SiteTuation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
</head>

<body>
  <nav id="navbar">
    <a href="{{ url_for('main.landingpage') }}" class="nav-logo">
      <img src="/static/images/Logo.png" alt="SiteTuation" class="nav-logo-img" />
    </a>
    <div class="nav-right">
      <a href="{{ url_for('auth.login') }}" class="btn-nav-login">Log In</a>
    </div>
  </nav>

  <section class="auth-page">
    <div class="auth-card">
      <span class="section-label">Create account</span>
      <h1 class="section-title">Register for SiteTuation</h1>
      <p class="section-sub">Sign up to save searches, access the dashboard, and get personalized insights.</p>

      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <form method="POST" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username"
            required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a password"
            required />
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control"
            placeholder="Repeat your password" required />
        </div>

        <button type="submit" class="btn-hero-primary btn-auth">Create account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
      </div>
    </div>
  </section>
</body>

</html>
