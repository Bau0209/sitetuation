<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · SiteTuation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}" />
</head>
<body>
  <nav id="navbar">
    <a href="{{ url_for('main.landingpage') }}" class="nav-logo">
      <img src="/static/images/Logo.png" alt="SiteTuation" class="nav-logo-img" />
    </a>
    
    <div class="nav-right">
      <a href="{{ url_for('main.register') }}" class="btn-nav-cta">
        Register
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </nav>

  <section class="auth-page">
    <div class="auth-card">
      <span class="section-label">Welcome back</span>
      <h1 class="section-title">Sign in to SiteTuation</h1>
      <p class="section-sub">Use your account to access the dashboard and location intelligence tools.</p>

      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <form method="POST" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn-hero-primary btn-auth">Sign In</button>
      </form>

      
    </div>
  </section>
</body>
</html>
